# supported datatypes
# (u)int8_t, (u)int16_t, (u)int32_t, (u)int64_t, float, double (double needs to be verified working)

# Stick channel override for indiflight's PI OVERRIDE box mode (rx/pi_override.c).
# Values follow Betaflight's usual 1000-2000 RC pulse convention, same as rcData -
# only takes effect on channels enabled in pi_override_channels_mask while the
# PI OVERRIDE box mode is active on the base receiver.
fields:
  time_us: uint32_t
  roll: uint16_t      # 1000-2000, same convention as rcData
  pitch: uint16_t
  yaw: uint16_t
  throttle: uint16_t
