# supported datatypes
# uint8_t, uint16_t, uint32_t, uint64_t, float, double

# raw rcData[] values of all aux channels (i.e. excluding roll/pitch/yaw/throttle),
# range [1000;2000], see MAX_AUX_CHANNEL_COUNT in rx/rx.h
# 4 + 2 * 14 = 32 bytes per message
fields:
  time_us: uint32_t
  aux_1: int16_t
  aux_2: int16_t
  aux_3: int16_t
  aux_4: int16_t
  aux_5: int16_t
  aux_6: int16_t
  aux_7: int16_t
  aux_8: int16_t
  aux_9: int16_t
  aux_10: int16_t
  aux_11: int16_t
  aux_12: int16_t
  aux_13: int16_t
  aux_14: int16_t
