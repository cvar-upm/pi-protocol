# supported datatypes
# uint8_t, uint16_t, uint32_t, uint64_t, float, double

# Round-trip clock exchange, same shape as MAVLink's TIMESYNC: the host fills
# seq and host_ns and sends with fc_time_us = 0, the FC echoes both back with
# fc_time_us set to its micros() at handling time. That gives the host the
# offset, from the FC stamp against the midpoint of its own send and receive
# instants, and the round trip, from their difference.
fields:
  seq: uint32_t         # echoed verbatim, pairs a reply with its request
  host_ns: uint64_t     # host clock when the request was sent, echoed verbatim
  fc_time_us: uint32_t  # FC micros() when the exchange was handled, 0 in a request
