# supported datatypes
# uint8_t, uint16_t, uint32_t, uint64_t, float, double

# Measured motor angular speeds (rad/s), indexed in Betaflight's own mixer output
# order (mixerQuadX[] = [RR, FR, RL, FL]) - NOT the indi_controller/simulator
# convention ([FR, RR, RL, FL]) used elsewhere in the wider workspace.
fields:
  time_us: uint32_t
  omega0: float
  omega1: float
  omega2: float
  omega3: float
