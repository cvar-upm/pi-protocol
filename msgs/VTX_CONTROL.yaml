# supported datatypes
# uint8_t, uint16_t, uint32_t, uint64_t, float, double

# Host request to switch an MSP VTX on or off (indiflight io/vtx_msp.c), so the
# VTX does not overheat while the drone waits on the ground.
#
# A lease, not a latch: ON only holds while it keeps being repeated within the
# FC's timeout (3 s), and a lease that expired or was never received counts as
# OFF, so the VTX also goes off if the host dies without saying so. OFF is the
# vtxtable power level whose power value is 0 (true 0mW on HDZero: RF and image
# transmitter shut down), not pit mode, which keeps both running at 0.1mW.
#
# The FC ignores this while armed or in failsafe, where the VTX is always on,
# and entirely unless vtx_pi_control = ON. time_us is not checked.
fields:
  time_us: uint32_t
  enable: uint8_t  # 1 = VTX on, 0 = VTX off (0mW)
